services:
  redis:
    image: redis:7-alpine
    ports:
      # Bound to localhost only - this compose file is for local dev, and
      # Redis has no auth configured. A real deployment needs a managed/
      # authenticated Redis instance, not this container exposed publicly.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
